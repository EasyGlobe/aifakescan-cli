name: Public client checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Cross-platform license inventory with an empty module cache
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts -p "test_*.py"
        env:
          AIFAKESCAN_TEST_EMPTY_MODULE_CACHE: '1'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/aifakescan

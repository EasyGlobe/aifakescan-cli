name: Public client checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Cross-platform license inventory with an empty module cache
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts -p "test_*.py"
        env:
          AIFAKESCAN_TEST_EMPTY_MODULE_CACHE: '1'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/aifakescan
